server {
 listen 80;
 listen [::]:80;
 server_name aff.pramool.bid;
 location ^~ /.well-known/acme-challenge/ { root /var/www/shopee-aff-acme; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl http2;
 listen [::]:443 ssl http2;
 server_name aff.pramool.bid;
 ssl_certificate /etc/letsencrypt/live/aff.pramool.bid/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/aff.pramool.bid/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 110m;
 add_header Strict-Transport-Security 'max-age=31536000' always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location /api/ {
  proxy_pass http://127.0.0.1:8100;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_read_timeout 180s;
  proxy_buffering off;
  add_header Cache-Control 'no-store' always;
 }
 location / {
  proxy_pass http://127.0.0.1:3100;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
 }
}
